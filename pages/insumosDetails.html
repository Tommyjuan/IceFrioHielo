<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Insumos</title>
  <link rel="stylesheet" href="/css/css-pages/Details.css" />
  <script defer src="../js/main.js"></script>
 
</head>
<body>
  <div id="cabecera" data-include="../template/cabecera.html"></div>

  <div class="producto-contenedor" id="productosInsumos"></div>

  <div class="producto-contenedor">

    <div class="producto">
      <img src="/img/vasosIcopor.jpg" alt="Producto 1">
      <p>Descripción del producto 1</p>
      <p class="precio">$50.000</p>
      <button class="agregar-al-carrito" onclick="agregarAlCarrito('Producto 1', '$50.000')">
        <span class="icono-carrito">&#128722;</span> Agregar al carrito
      </button>
    </div>

    <div class="producto">
      <img src="/img/ziplocPeque.jpg" alt="Producto 2">
      <p>Descripción del producto 2</p>
      <p class="precio">$45.000</p>
      <button class="agregar-al-carrito" onclick="agregarAlCarrito('Producto 2', '$45.000')">
        <span class="icono-carrito">&#128722;</span> Agregar al carrito
      </button>
    </div>

    <div class="producto">
      <img src="/img/pitillos.jpg" alt="Producto 3">
      <p>Descripción del producto 3</p>
      <p class="precio">$60.000</p>
      <button class="agregar-al-carrito" onclick="agregarAlCarrito('Producto 3', '$60.000')">
        <span class="icono-carrito">&#128722;</span> Agregar al carrito
      </button>
    </div>
  </div>

  <div id="pie" data-include="../template/pie.html"></div>

</html>
