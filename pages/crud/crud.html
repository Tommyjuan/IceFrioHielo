<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CRUD IceFrioHielo</title>
    <link rel="stylesheet" href="/css/crud/crud.css" />
    <script defer src="/js/crud/crud.js"></script>
</head>

<body>
    <div style="text-align: right; margin: 10px;">
        <button onclick="cerrarSesion()">Cerrar sesión</button>
    </div>

    <div class="container">
        <h1>IceFrioHielo</h1>

        <form id="productoForm" class="form-grid">
            <div class="form-group">
                <input type="text" id="nombre" placeholder="Nombre del producto" required />
                <input type="file" id="imagen" accept="image/*" />
            </div>

            <div class="form-group">
                <input type="text" id="descripcion" placeholder="Descripción" required />
                <select id="categoria" required>
                    <option value="">Seleccione una categoría</option>
                    <option value="Granizadoras">Granizadoras</option>
                    <option value="Insumos">Insumos</option>
                    <option value="Dulces">Dulces</option>
                </select>
            </div>

            <div class="form-group">
                <input type="number" id="precio" placeholder="Precio" required />
                <input type="number" id="cantidad" placeholder="Cantidad" required />
            </div>

            <button type="submit">Agregar Producto</button>
        </form>

        <h2>Lista de Productos</h2>
        <div class="tabla-responsive">
            <table id="productosTable">
                <thead>
                    <tr>
                        <th>Nombre</th>
                        <th>Imagen</th>
                        <th>Descripción</th>
                        <th>Precio</th>
                        <th>Cantidad</th>
                        <th>Categoría</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="productosBody"></tbody>
            </table>
        </div>


        <h2>Productos por Categoría</h2>
        <div id="categoriasContainer"></div>
    </div>
</body>

</html>
