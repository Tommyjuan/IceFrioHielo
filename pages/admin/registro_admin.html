<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Registro Admin</title>
  <script src="/js/admin/registro_admin.js"></script>
  <link rel="stylesheet" href="/css/admin/registro_admin.css">
</head>
<body>
  <h2>Registrar Administrador</h2>
  <form id="adminForm">
    <label>Nombre:</label><br>
    <input type="text" id="nombre" required><br><br>

    <label>Email:</label><br>
    <input type="email" id="email" required><br><br>

    <label>Contraseña:</label><br>
    <input type="password" id="password" required><br><br>

    <label>Token secreto:</label><br>
    <input type="text" id="token" placeholder="Ej: CLAVE-SECRETA-123" required><br><br>

    <button type="submit">Registrar Admin</button>
  </form>

  
</body>
</html>
