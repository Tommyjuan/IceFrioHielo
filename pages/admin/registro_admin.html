<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Registro Admin</title>
</head>
<body>
  <h2>Registrar Administrador</h2>
  <form id="adminForm">
    <label>Nombre:</label><br>
    <input type="text" id="nombre" required><br><br>

    <label>Email:</label><br>
    <input type="email" id="email" required><br><br>

    <label>Contraseña:</label><br>
    <input type="password" id="password" required><br><br>

    <label>Token secreto:</label><br>
    <input type="text" id="token" placeholder="Ej: CLAVE-SECRETA-123" required><br><br>

    <button type="submit">Registrar Admin</button>
  </form>

  <script>
    document.getElementById('adminForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const nombre = document.getElementById('nombre').value;
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const token = document.getElementById('token').value;

      try {
        const res = await fetch('http://localhost:8000/api/auth/register-admin?token=' + token, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ nombre, email, password })
        });

        const data = await res.json();
        if (res.ok) {
          alert(data.message);
        } else {
          alert("Error: " + data.detail);
        }
      } catch (error) {
        alert("Error de conexión");
      }
    });
  </script>
</body>
</html>
