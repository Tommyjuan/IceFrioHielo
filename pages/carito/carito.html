<!DOCTYPE html>
<html xmlns:th="">
<head>
    <title>Carrito de Compras</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #f8f9fa;
            padding: 20px;
        }

        h1 {
            text-align: center;
            color: #333;
        }

        table {
            width: 90%;
            margin: auto;
            border-collapse: collapse;
            background-color: #fff;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        th, td {
            padding: 12px;
            text-align: center;
            border-bottom: 1px solid #ddd;
        }

        th {
            background-color: #007bff;
            color: white;
        }

        img {
            border-radius: 8px;
        }

        .acciones {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .acciones form {
            margin: 2px;
        }

        button, .button-link {
            padding: 12px 20px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            text-decoration: none;
            color: white;
            cursor: pointer;
            transition: background-color 0.3s ease;
            display: inline-block;
        }

        /* Estilos específicos por tipo */
        .btn-aumentar {
            background-color: #28a745;
        }
        .btn-aumentar:hover {
            background-color: #218838;
        }

        .btn-disminuir {
            background-color: #ffc107;
            color: #212529;
        }
        .btn-disminuir:hover {
            background-color: #e0a800;
        }

        .btn-quitar {
            background-color: #dc3545;
        }
        .btn-quitar:hover {
            background-color: #c82333;
        }

        .btn-total {
            background-color: #6c757d;
            cursor: default;
        }

        .btn-whatsapp {
            background-color: #25D366;
        }
        .btn-whatsapp:hover {
            background-color: #20c35a;
        }

        .total-container {
            width: 90%;
            margin: 20px auto;
            text-align: right;
            font-size: 20px;
            font-weight: bold;
        }

        .total-container p {
            text-align: center;
        }

        a.button-link {
            text-align: center;
        }
    </style>
    </style>
</head>
<body>
    <h1>Carrito de Compras</h1>

    <table>
        <thead>
            <tr>
                <th>Imagen</th>
                <th>Nombre</th>
                <th>Cantidad</th>
                <th>Precio Unitario</th>
                <th>Subtotal</th>
                <th>Acción</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="p : ${carrito}">
                <td>
                    <img th:src="@{/uploads/{img}(img=${p.imagen})}" alt="imagen" width="100" />
                </td>
                <td th:text="${p.nombre}">Nombre</td>
                <td th:text="${p.cantidad}">Cantidad</td>
                <td th:text="${#numbers.formatDecimal(p.precio, 0, 'POINT', 0, 'POINT')}">Precio</td>
                <td th:text="${#numbers.formatDecimal(p.precio * p.cantidad, 0, 'POINT', 0, 'POINT')}">Subtotal</td>
                <td class="acciones">
                    <form th:action="@{/carrito/disminuir}" method="post">
                        <input type="hidden" name="id" th:value="${p.id}" />
                        <button type="submit" class="btn-disminuir">-</button>
                    </form>

                    <form th:action="@{/carrito/aumentar}" method="post">
                        <input type="hidden" name="id" th:value="${p.id}" />
                        <button type="submit" class="btn-aumentar">+</button>
                    </form>

                    <form th:action="@{/carrito/quitar}" method="post">
                        <input type="hidden" name="id" th:value="${p.id}" />
                        <button type="submit" class="btn-quitar">Quitar</button>
                    </form>
                </td>
            </tr>
        </tbody>
    </table>

    <div class="total-container">
        <p>
            <strong>Total:</strong>
            <button disabled class="button-link btn-total">
                $<span th:text="${#numbers.formatDecimal(total, 0, 'POINT', 0, 'POINT')}"></span>
            </button>
        </p>

       <a th:href="@{/checkout}" class="button-link btn-whatsapp">Comprar</a>

    </div>
</body>
</html>
